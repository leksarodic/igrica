name: Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - "game/**"
      - ".github/workflows/windows.yml"

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          $godot = (Get-ChildItem godot -Filter "*win64_console.exe" | Select-Object -First 1).FullName
          if (-not $godot) { throw "Godot console executable not found" }
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -OutFile templates.tpz
          Copy-Item templates.tpz templates.zip
          Expand-Archive templates.zip -DestinationPath templates
          $templates = Join-Path $env:APPDATA "Godot/export_templates/4.7.2.stable"
          New-Item -ItemType Directory -Force $templates | Out-Null
          Copy-Item "templates/templates/*" $templates -Recurse -Force
          Add-Content $env:GITHUB_PATH (Split-Path $godot)

      - name: Export Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build/windows | Out-Null
          $godot = (Get-ChildItem godot -Filter "*win64_console.exe" | Select-Object -First 1).FullName
          & $godot --headless --path game --import
          if ($LASTEXITCODE -ne 0) { throw "Godot import failed with exit code $LASTEXITCODE" }
          & $godot --headless --path game --export-release "Windows Desktop" "$pwd/build/windows/TheLongNote.exe"
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "build/windows/TheLongNote.exe")) { throw "Export did not produce an exe" }

      - name: Smoke test on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $all = @()
          foreach ($region in @("bellhollow", "reedwater", "sunken_choir")) {
            Write-Host "=== $region ==="
            $log = Join-Path $pwd "smoke_$region.log"
            $p = Start-Process -FilePath "build/windows/TheLongNote.exe" `
              -ArgumentList @("--headless", "--quit-after", "6", "--", "--world", $region) `
              -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError "$log.err"
            if ($p.ExitCode -ne 0) { throw "Smoke test failed for $region with exit code $($p.ExitCode)" }
            $out = @(Get-Content $log -ErrorAction SilentlyContinue) + @(Get-Content "$log.err" -ErrorAction SilentlyContinue)
            $out | Write-Host
            $all += $out
            if (($out -join "`n") -match "SCRIPT ERROR") { throw "Script error in $region" }
          }
          $all | Out-File smoke.log

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/TheLongNote.exe" -DestinationPath "build/windows/TheLongNote-0.1.0-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: TheLongNote-0.1.0-Windows
          path: build/windows/TheLongNote-0.1.0-Windows.zip
